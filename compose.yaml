{
  "name": "gjnet",
  "services": {
    "dashboard": {
      "build": { "context": "." },
      "restart": "unless-stopped",
      "ports": ["${GJNET_BIND:-127.0.0.1}:${GJNET_PORT:-8080}:8080"],
      "environment": {
        "DashboardPassword": "${GJNET_PASSWORD:?Set GJNET_PASSWORD}",
        "McpToken": "${GJNET_MCP_TOKEN:-}",
        "TrustedProxies": "${GJNET_TRUSTED_PROXIES:-}",
        "PROXMOX_TOKEN": "${PROXMOX_TOKEN:-}",
        "DOCKHAND_TOKEN": "${DOCKHAND_TOKEN:-}",
        "IDRAC_PASSWORD": "${IDRAC_PASSWORD:-}",
        "SERVER2_IDRAC_PASSWORD": "${SERVER2_IDRAC_PASSWORD:-}",
        "SERVER3_IDRAC_PASSWORD": "${SERVER3_IDRAC_PASSWORD:-}"
      },
      "volumes": ["gjnet-data:/data"],
      "security_opt": ["no-new-privileges:true"],
      "cap_drop": ["ALL"]
    }
  },
  "volumes": { "gjnet-data": {} }
}
